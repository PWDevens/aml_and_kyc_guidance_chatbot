# -----------------------------------------------------------------------------
# AUTHORED, NEVER EXECUTED. This repository has no git remote and no GitHub
# Actions runner has ever run anything against it (verified: `git remote -v`
# returns nothing). This workflow is inert repo content — a ready-to-push
# artifact — not a claim that CI has run or is green. Its steps are the exact
# same install/test/build-index commands verified LOCALLY this iteration (see
# .build/iter-5/test-results.md AC-1/AC-2/AC-5): `pip install -r
# requirements.lock`, then build the index + seed the FAQ db, then
# `pytest tests/ -q`. Push this repo to a remote and enable Actions to
# actually run it.
#
# Index-build step (tester SME review, iter-5 gate): the test suite
# (tests/test_smoke.py, tests/test_corpus_breadth.py,
# tests/test_iter5_coverage.py) reads directly from CONFIG.chroma_path via
# factory.retrieve()/get_collection() and there is no fixture that builds an
# index automatically — test_smoke.py's own docstring says "requires a built
# index." docs/ROADMAP.md §4 says CI "does not rebuild the index... matching
# fedacq", but that assumes the index is committed via Git LFS the way the
# sibling fedacq-rag-chatbot project does. This project explicitly rules that
# out (.build/iter-5/spec.md §0: "Git LFS is out of scope — no remote to push
# LFS to. Build-from-scratch is the real, verifiable path"; the index is
# gitignored, data/chroma/ + data/*.db). So on a real runner with no
# committed index, ROADMAP's "don't rebuild" premise does not hold here, and
# this job builds the index + seeds the FAQ db first (the same commands the
# README Quickstart and AC-5 verified) so the test job matches what was
# actually locally verified rather than failing at the first test that
# touches the collection.
#
# Runtime note (D9): the full suite is ~164s locally, dominated by one
# ~130s live-API test (tests/test_etl_fedreg_live.py) that calls the real
# Federal Register API and is network-tolerant (pytest.skip on failure/
# unreachable API — see that test file), so it will not hard-fail an offline
# or rate-limited CI runner. The index-build step adds a further ~1-2 min of
# live eCFR/Federal-Register API calls (see README Quickstart). Do not
# expect/claim a sub-minute CI run.
#
# Per docs/ROADMAP.md §4 / docs/ARCHITECTURE.md §9, the intended full CI
# pipeline also builds/uploads a Docker image. The Docker build/upload job
# below is included for completeness per that intent but, like the rest of
# this file, has never run.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Build index and seed FAQ
        run: |
          python -m scripts.build_index
          python -m scripts.seed_faq

      - name: Run test suite
        run: pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    # Documents the intended Docker build/upload step (ROADMAP §4). Does not
    # push anywhere by default — no registry credentials are configured in
    # this repo. Left as a build-only step; wire a registry login + push
    # manually when a remote/registry exists.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aml-kyc-rag-chatbot:ci .
