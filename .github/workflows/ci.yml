# -----------------------------------------------------------------------------
# CI — run and verified green. First executed on 2026-07-23 against
# github.com/PWDevens/aml_and_kyc_guidance_chatbot (run #30031024428, PR #1):
# the `test` and `docker-build` jobs both passed on ubuntu-latest. Earlier
# revisions of this file were authored but never run (the project was
# originally developed on a machine with no Docker and no git remote); that is
# no longer the case.
#
# Steps mirror the locally-verified commands (README Quickstart,
# .build/iter-5/test-results.md): install from requirements.lock, build the
# index + seed the FAQ db (the index is gitignored and not committed, so CI
# builds it from the live eCFR + Federal Register APIs), then run the suite.
#
# The suite's one long, network-dependent test (tests/test_etl_fedreg_live.py,
# ~130s, hits the real Federal Register API and is skip-tolerant) is split out
# into its own non-blocking step so it neither slows the required signal nor
# fails the pipeline on a rate-limited/offline runner.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Build index and seed FAQ
        run: |
          python -m scripts.build_index
          python -m scripts.seed_faq

      - name: Run test suite (deterministic subset)
        run: pytest tests/ -q --deselect tests/test_etl_fedreg_live.py

      - name: Run live Federal Register ETL test (network-dependent, non-blocking)
        continue-on-error: true
        run: pytest tests/test_etl_fedreg_live.py -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t aml-kyc-rag-chatbot:ci .

      # Publish to GitHub Container Registry only on a push to main (not on PRs
      # or forks) — GITHUB_TOKEN has packages:write for the repo's own GHCR
      # namespace, so no extra secret is required.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aml-kyc-rag-chatbot"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker tag aml-kyc-rag-chatbot:ci "$IMAGE:latest"
          docker tag aml-kyc-rag-chatbot:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
